name: Build DeepSeek Harness FPK

# 仅允许被 build-release.yml 调用，不配置 push 或 workflow_dispatch 触发器。
on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to which the FPK is uploaded
        required: true
        type: string
      release_id:
        description: Release database ID used for the asset upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build fn-deepseek-harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_ID: ${{ inputs.release_id }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup pnpm 11 for fnOS gateway build
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      # 只需要网关和 CLI：FPK 不再内置插件，因此不构建插件包，也不装它们的
      # workspace 依赖 `@tnnevol/dsh-semi-ui`。
      - name: Install repository build dependencies
        run: pnpm install --filter @tnnevol/fnos-gateway... --filter @tnnevol/fnos-dsh-cli --frozen-lockfile

      - name: Install fnpack
        run: |
          curl -fsSL https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64 -o fnpack
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/fnpack
          fnpack --help

      # 只编译 DSH 应用本身，不把仓库内的 DSH 插件打进 FPK。插件由用户在应用内
      # 通过 `dsh plugin` 从 npm 安装，FPK 不再随包分发插件归档。
      #
      # node-pty 使用随 npm 包发布的平台预编译产物，构建与安装都不再需要编译，
      # 因此 FPK 不再内置原生产物；`--skip-bundle-dsh-plugins` 禁止进入插件内置
      # 询问，保证 CI 非交互执行。
      #
      # 平台显式传两个（FNOS-044）：一次发布同时产出 x86 与 arm 两份包。这里不依赖
      # 「缺省取 manifest 声明」——清单只声明 x86，缺省就只会得到一份 x86 包。
      - name: Build fn-deepseek-harness FPK
        run: pnpm run build -- --fpk --app fn-deepseek-harness --skip-bundle-dsh-plugins --platform x86 --platform arm

      # FPK 附件命名 = 平台 + 项目版本（Tag）+ DSH 基线（构建期从 catalog 派生，不硬编码）。
      # catalog 的 '@deepseek-ai/dsh' 是基线唯一事实来源；与 install_callback 中的
      # DSH_VERSION 由 fnos-dsh-cli 的构建校验保证一致。
      #
      # 模板与 `tooling/fnos-dsh-cli/src/core/fpk-artifacts.ts` 的 `fpkReleaseFileName`
      # 同形，由 `tests/fpk-release-naming.spec.ts` 钉住：任一侧改了模板而另一侧没跟上，
      # 该用例即失败。
      - name: Verify versioned FPK artifacts
        id: rename
        working-directory: apps/fn-deepseek-harness
        run: |
          set -euo pipefail

          DSH_BASELINE="$(sed -nE "s/^  '@deepseek-ai\/dsh':[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p" \
            ../../pnpm-workspace.yaml | head -n 1)"
          if [ -z "$DSH_BASELINE" ]; then
            echo "ERROR: DSH baseline not found in pnpm-workspace.yaml catalog" >&2
            exit 1
          fi

          # 逐平台核对。旧写法用 `find . -maxdepth 1 -name '*.fpk' -print -quit` 取
          # 「第一个」：目录里有两份平台包时只会挑到其中一份，另一份既不检查也不上传，
          # 而步骤照样成功——Release 少一个平台的包是无声的。
          FPK_FILES=()
          for PLATFORM in x86 arm; do
            VERSIONED_FPK="fn-deepseek-harness-${PLATFORM}-${RELEASE_TAG}-dsh-${DSH_BASELINE}.fpk"
            if [ ! -f "$VERSIONED_FPK" ]; then
              # 构建命令自身已按当前 tag 命名好产物（检出里就是该 tag），正常到这里即已
              # 存在。兜底分支只在异常情况下生效，且必须按 fnpack 固定名取源——扫目录
              # 取第一个正是 FNOS-037 修掉的错配来源。
              if [ -f fn-deepseek-harness.fpk ]; then
                mv fn-deepseek-harness.fpk "$VERSIONED_FPK"
              else
                echo "ERROR: ${VERSIONED_FPK} was not produced" >&2
                ls -1 ./*.fpk >&2 2>/dev/null || echo "(no .fpk file in this directory)" >&2
                exit 1
              fi
            fi
            FPK_FILES+=("$VERSIONED_FPK")
            echo "Prepared ${VERSIONED_FPK}"
          done

          printf 'fpk_files=%s\n' "${FPK_FILES[*]}" >> "$GITHUB_OUTPUT"

      - name: Upload FPK assets to release
        working-directory: apps/fn-deepseek-harness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FPK_FILES: ${{ steps.rename.outputs.fpk_files }}
        run: |
          set -euo pipefail

          upload_asset() {
            local ASSET_PATH="$1"
            local ASSET_NAME
            ASSET_NAME="$(basename "$ASSET_PATH")"
            local existing_asset_id
            existing_asset_id="$(
              gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate 2>/dev/null \
                | jq -r --arg name "$ASSET_NAME" '.[] | select(.name == $name) | .id' \
                | head -n 1 \
                || true
            )"
            if [ -n "$existing_asset_id" ]; then
              gh api --method DELETE "repos/${REPOSITORY}/releases/assets/${existing_asset_id}" >/dev/null
            fi
            gh api --method POST \
              "https://uploads.github.com/repos/${REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}" \
              -H "Content-Type: application/octet-stream" \
              --input "$ASSET_PATH" >/dev/null
            echo "Uploaded ${ASSET_NAME} to Release ${RELEASE_TAG}."
          }

          # 每个平台各自重试；任一平台最终传不上就整体失败，避免 Release 只有一半产物。
          FAILED=""
          for ASSET_PATH in $FPK_FILES; do
            for ATTEMPT in 1 2 3 4 5; do
              if upload_asset "$ASSET_PATH"; then
                break
              fi
              if [ "$ATTEMPT" -eq 5 ]; then
                FAILED="${FAILED:+${FAILED} }${ASSET_PATH}"
              else
                DELAY=$((ATTEMPT * 15))
                echo "Release upload of ${ASSET_PATH} failed; retrying in ${DELAY}s (attempt ${ATTEMPT}/5)" >&2
                sleep "$DELAY"
              fi
            done
          done

          if [ -n "$FAILED" ]; then
            echo "ERROR: unable to upload after 5 attempts: $FAILED" >&2
            exit 1
          fi
