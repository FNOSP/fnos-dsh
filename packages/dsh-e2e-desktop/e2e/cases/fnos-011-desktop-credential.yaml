# FNOS-011 Desktop 端凭据两态区分（DSH Desktop）
#
# 用例编号与 docs/tests/FNOS-011-credential-permission-diagnostics.md 对齐：
# 测试文档是**权威台账**，本文件是**执行载体**。
#
# ## 覆盖什么
#
# **TC-015**：FNOS-011-04 要求插件区分「凭据存在但不可读」与「凭据不存在」两种情形，
# 且结论要求 Desktop 与 Web 一致：
#
# | 现场 | 期望呈现 |
# | --- | --- |
# | `chmod 000`（属主不可读） | 报凭据异常并给出修复指引，**不是**「未登录」 |
# | 文件不存在 | 呈现「未登录」，**不报**权限异常 |
#
# Web 侧这两态已由 `plugins/dsh-codebuddy-plugin/tests/e2e/` 的 TC-013b / TC-014a 用
# DOM 契约断言覆盖。本文件补 Desktop 侧的同一判据。
#
# ## 导航要两步（实测结构）
#
# 侧边栏「插件」入口打开的是**列表页**，详情页要点其中的插件条目；列表条目显示的是
# **包名** `@tnnevol/dsh-codebuddy`，不是「CodeBuddy」。一步到位必然失败，且失败信息
# 容易被误读成「插件没装」。
#
# 侧边栏类名带构建哈希（实测 `_58WOtG_panelRow`），不能作选择器，因此按
# 「容器 + 文本完全相等」定位（见 `dsh.desktopClickText`）。
#
# ## 断言契约（取自组件源码，不靠猜）
#
# `plugins/dsh-codebuddy-plugin/src/client/panel.tsx`：`credentialState === 'unusable'`
# 时渲染 `<div className="dsh-codebuddy-credential-alert" role="alert">`，内含两段文案
# （`locales/zh.ts`）：凭据文件存在但不可读（权限位异常）…；…chmod 600…不需要重新登录。
#
# ## 为什么只用「健康态」这一条自动化
#
# 另外两态（0000 / 不存在）需要**改 Desktop 宿主读到的凭据文件状态**，而桌面自动化
# 到不了宿主机文件系统（CDP 只能作用于渲染进程）。因此这两条按测试规范的
# 「账号状态测试顺序与 auth 配置备份」由执行者手工造现场后执行，步骤见文件末尾；
# 自动化只覆盖**不需要造现场**的健康态——它同样有价值：证明「有可读账号时**不**出现
# 警示块」，这是两态可区分的另一半。
#
# ## 不留痕
#
# 用例只读取界面，不切换会话、不发消息、不改任何设置；CDP 通道不移动鼠标、不切前台。

cases:
  # ── TC-015a：健康态下不出现权限异常警示（两态可区分的另一半） ────
  - name: TC-015a Desktop 端凭据正常时不显示权限异常警示
    tags: [FNOS-011, desktop, readonly]
    steps:
      # 前置：进入 CodeBuddy 插件详情页。分两步是因为「插件」入口先打开**列表页**
      # （实测界面文字："插件 / 安装、启用和配置插件 / 添加插件 / 官方 8 …"），
      # 详情页要再点插件条目。一步到位会失败，且失败原因容易被误读成插件没装。
      - dsh.desktopClickText:
          text: 插件
          container: nav
          retries: 2
          verify: |
            (() => {
              const text = document.body?.innerText || '';
              // 列表页会出现「添加插件」；会话页不会（实测可靠区分）。
              if (text.includes('添加插件')) return { pass: true, detail: '已进入插件列表页' };
              return { pass: false, detail: '未进入插件列表页（未见「添加插件」）' };
            })()

      - dsh.desktopClickText:
          # 列表里的条目显示的是**包名**（实测），不是「CodeBuddy」这个拟人化叫法。
          text: '@tnnevol/dsh-codebuddy'
          retries: 2
          verify: |
            (() => {
              const panel = document.querySelector('.dsh-codebuddy-panel-page');
              if (panel !== null) return { pass: true, detail: 'CodeBuddy 面板已挂载' };
              return {
                pass: false,
                detail: '点击 CodeBuddy 后未见详情面板；当前：'
                  + (document.body?.innerText || '').replace(/\s+/g, ' ').slice(0, 90),
              };
            })()

      - dsh.desktopAssert:
          label: 健康凭据下 CodeBuddy 面板无权限异常警示块
          script: |
            (() => {
              const panel = document.querySelector('.dsh-codebuddy-panel-page');
              if (panel === null) {
                return { pass: false, detail: 'CodeBuddy 面板未挂载，无法判断' };
              }
              const alert = document.querySelector('.dsh-codebuddy-credential-alert');
              if (alert !== null) {
                return {
                  pass: false,
                  detail: '凭据可读却出现权限异常警示：' + (alert.textContent || '').trim().slice(0, 80),
                };
              }
              // 反向确认：面板确实显示了账号，而不是空面板造成的「恰好没有警示块」。
              const text = panel.textContent || '';
              const hasEmptyState = text.includes('暂无已登录账号');
              const accountCount = (text.match(/已完成|已签到/g) || []).length;
              if (hasEmptyState && accountCount === 0) {
                return { pass: false, detail: '面板既无警示块也无账号，无法区分是哪种状态' };
              }
              return {
                pass: true,
                detail: hasEmptyState ? '空状态且无警示块' : '已显示账号且无警示块',
              };
            })()

# ── 下面两条需要手工造现场，按测试规范执行后验证 ──────────────────
#
# ## TC-015b（凭据 0000 → 报异常，不静默呈现为「未登录」）
#
# 前置（**在宿主机执行，桌面自动化到不了**）：
#
# ```bash
# # 1. 备份到 tmp/（只在工作区备份，不留在用户目录或 NAS）
# mkdir -p tmp/auth-back/dsh-codebuddy-$(date +%Y%m%d)
# cp -p .dsh/codebuddy-auth.json tmp/auth-back/dsh-codebuddy-$(date +%Y%m%d)/
# # 2. 造现场（Desktop 的 DSH_HOME 指向项目根 .dsh）
# chmod 000 .dsh/codebuddy-auth.json
# # 3. 重启 Desktop 宿主使其重新读取
# ```
#
# 执行：在 Desktop 里进入插件 → @tnnevol/dsh-codebuddy 详情页，确认
#
# - `.dsh-codebuddy-credential-alert` 存在且 `role="alert"`；
# - 文案含「凭据文件存在但不可读」与「chmod 600」；
# - 面板**没有**退化成「暂无已登录账号」的普通空状态。
#
# 恢复（必做）：`cp -p` 回原位后**显式** `chmod 600`
# （`cp -p` 会带上源文件的异常权限位，只依赖它会制造下一次启动失败），再重启 Desktop。
#
# ## TC-015c（凭据不存在 → 呈现未登录，不报异常）
#
# 前置：`mv .dsh/codebuddy-auth.json tmp/auth-back/`（移走而非改权限），重启 Desktop。
#
# 执行：进入同一详情页，确认
#
# - 面板显示「暂无已登录账号」；
# - `.dsh-codebuddy-credential-alert` **不存在**——仅是不存在，不该报成权限问题。
#
# 恢复：移回原位并 `chmod 600`，重启 Desktop 确认账号重新出现。