# FNOS-011 Desktop 端凭据两态区分（DSH Desktop）
#
# 用例编号与 docs/tests/FNOS-011-credential-permission-diagnostics.md 对齐：
# 测试文档是**权威台账**，本文件是**执行载体**。
#
# ## 覆盖什么
#
# **TC-015**：FNOS-011-04 要求插件区分「凭据存在但不可读」与「凭据不存在」两种情形，
# 且结论要求 Desktop 与 Web 一致：
#
# | 现场 | 期望呈现 |
# | --- | --- |
# | `chmod 000`（属主不可读） | 报凭据异常并给出修复指引，**不是**「未登录」 |
# | 文件不存在 | 呈现「未登录」，**不报**权限异常 |
#
# Web 侧这两态已由 `plugins/dsh-codebuddy-plugin/tests/e2e/` 的 TC-013b / TC-014a 用
# DOM 契约断言覆盖。本文件补 Desktop 侧的同一判据。
#
# ## 断言契约（取自组件源码，不靠猜）
#
# `plugins/dsh-codebuddy-plugin/src/client/panel.tsx`：`credentialState === 'unusable'`
# 时渲染 `<div className="dsh-codebuddy-credential-alert" role="alert">`，内含两段文案
# （`locales/zh.ts`）：凭据文件存在但不可读（权限位异常）…；…chmod 600…不需要重新登录。
#
# ## 造现场不需要重启宿主（实测更正）
#
# 宿主侧 `panelStatus()` 每次都调 `loadStorage()` 与 `storageFileState()`，**无内存缓存**
# （`storage.ts:454` / `storage.ts:425`）；凭据路径由 `dshHomePath()` 解析，Desktop 的
# `DSH_HOME` 指向项目根 `.dsh`。所以改**同一个文件** `.dsh/codebuddy-auth.json` 即可，
# **不需要重启 Desktop**。
#
# 但要让界面重新取数，必须**完全离开插件面板**（切回会话页）再重新进入：
#
# - 实测面板里的「刷新」按钮只刷账号数据、不刷凭据状态——权限已恢复 `600` 且点了「刷新」时，
#   警示块仍在；
# - 实测只切到插件列表页也不够：宿主仍复用缓存，文件确已不存在时照样显示旧的「权限异常」；
#   切回会话页再进入才拿到新状态。
#
# 这也是本文件每个破坏性用例前两步都是「回会话页 → 进插件列表页」的原因。
#
# 造现场与恢复在**宿主机**执行（桌面自动化到不了文件系统），命令写在各用例的注释里。
#
# **为什么 TC-015c 拆到另一个文件**：TC-015b 的现场是 `chmod 000`，TC-015c 的现场是
# 「文件不存在」——两者**互斥**，同一轮里不可能同时成立。而 Midscene Test 没有
# `--case` 参数，只能按文件选择，所以两条必须分属不同文件才能各自跑。
#
# ## 页面内定时器会被节流（实测）
#
# Desktop 窗口在后台时页面内的 `setTimeout` 被系统节流：实测 3 次 `setTimeout(100)`
# 实际耗时约 **2.5 秒**（放大约 8 倍）。因此**不要在页面脚本里轮询等待**——30 轮会超过
# CDP 求值的 30 秒超时（实测报 `CDP 求值超时`）。等待一律用 `sleep` Node 在 Node 侧做。
#
# ## 导航要两步，且步骤必须幂等
#
# 侧边栏「插件」入口打开的是**列表页**（出现「添加插件」），详情页要点其中的插件条目；
# 列表条目显示的是**包名** `@tnnevol/dsh-codebuddy`，不是「CodeBuddy」。定位靠两条稳定契约：
#
# 1. 包名文本所在的 `titleRow` **带子元素**，所以「叶子节点 + 文本完全相等」匹配不到；
#    要找「文本以包名开头」的元素（实测 `div.W9KtXa_cardHead`）。
# 2. 真正带 `onClick` 的是卡片**内部**的 **`<button>`**（实测类名 `W9KtXa_cardTitle`）：
#    沿 `li → ul → section → div` 整条祖先链查 React 事件处理器，**一个都没有**——
#    所以点 `li`、点 `div`、甚至派发 pointer 事件都只是「点了但没反应」，面板不挂载。
#    （这是实测连踩三次才定位到的：先怀疑哈希类名、再怀疑 `li`、最后查 React props 才看清。）
#
# 类名都带构建哈希（`_58WOtG_panelRow`、`W9KtXa_*`），不能作选择器，故按上述语义契约定位。
#
# 每步都写成**幂等**的：已在目标态时直接返回成功，不强点——实测在插件面板里再点「插件」
# 不会产生导航，强行点击会导致失败。
#
# ## 不留痕
#
# 用例只读界面：不切换会话、不发消息、不改任何设置；CDP 通道不移动鼠标、不切前台。

cases:
  # ── TC-015a：健康态（凭据可读）不出现权限异常警示 ──────────────────
  #
  # 造现场：`.dsh/codebuddy-auth.json` 存在且为 `600`（正常状态，无需准备）。
  #
  # 注意：本用例同样先「离开插件面板」一次，因为凭据文件可能**刚被恢复**（改回 600 或
  # 移回原位），而宿主在重新读盘前仍持有旧快照——不强制重读就会断言在恢复前的状态上。
  - name: TC-015a Desktop 端凭据正常时不显示权限异常警示
    tags: [FNOS-011, desktop, readonly]
    steps:
      # 先离开插件面板一次，强制宿主重新读盘：凭据文件可能刚被恢复（改回 600 或移回原位），
      # 宿主此时仍持有旧快照。不这么做就会读到恢复前的空状态（实测踩过）。
      - dsh.desktopAssert:
          label: 先离开插件面板以强制重读
          script: |
            (() => {
              const row = document.querySelector('[data-row-key^="session:"]');
              if (row === null) return { pass: false, detail: '侧边栏没有会话行' };
              row.click();
              return { pass: true, detail: '已点会话行，插件面板将卸载' };
            })()

      - dsh.sleep:
          milliseconds: 800

      - dsh.desktopAssert:
          label: 进入插件列表页（已在则直接用）
          script: |
            (() => {
              if ((document.body?.innerText || '').includes('添加插件')) {
                return { pass: true, detail: '已在插件列表页' };
              }
              const nav = document.querySelector('nav');
              const entry = nav
                && [...nav.querySelectorAll('*')]
                  .find(n => n.children.length === 0 && (n.textContent || '').trim() === '插件');
              if (entry === undefined) return { pass: false, detail: '侧边栏无「插件」入口' };
              entry.click();
              return { pass: true, detail: '已点击「插件」' };
            })()

      - dsh.sleep:
          milliseconds: 800

      - dsh.desktopAssert:
          label: 打开 CodeBuddy 详情页（已打开则直接用）
          script: |
            (() => {
              if (document.querySelector('.dsh-codebuddy-panel-page') !== null) {
                return { pass: true, detail: '详情页已挂载' };
              }
              // 真正带 onClick 的是卡片**内部**的 <button>（实测类名 W9KtXa_cardTitle），
              // 不是 li：整条 li→ul→section 祖先链上都没有任何 React 事件处理器，
              // 所以点 li / 点 div 都只是「点了但没反应」，面板不会挂载。
              // 类名带构建哈希不能作选择器，故按「按钮文本以包名开头」定位。
              const btn = [...document.querySelectorAll('button')]
                .find(b => (b.textContent || '').trim().startsWith('@tnnevol/dsh-codebuddy'));
              if (btn === undefined) return { pass: false, detail: '插件列表里没有该条目按钮' };
              btn.click();
              return { pass: true, detail: '已点击插件条目按钮' };
            })()

      # 面板是异步渲染的：点开后先等它挂载完再断言，否则抢跑。
      - dsh.sleep:
          milliseconds: 1500

      - dsh.desktopAssert:
          label: 凭据可读时无权限异常警示，且确实显示了账号
          script: |
            (() => {
              const panel = document.querySelector('.dsh-codebuddy-panel-page');
              if (panel === null) return { pass: false, detail: 'CodeBuddy 面板未挂载' };
              const alert = document.querySelector('.dsh-codebuddy-credential-alert');
              if (alert !== null) {
                return {
                  pass: false,
                  detail: '凭据可读却出现权限异常警示：'
                    + (alert.textContent || '').trim().slice(0, 80),
                };
              }
              const text = panel.textContent || '';
              if (text.includes('暂无已登录账号')) {
                return { pass: false, detail: '凭据可读却显示未登录空状态' };
              }
              return { pass: true, detail: '已显示账号且无警示块' };
            })()

  # ── TC-015b：凭据不可读（0000）报异常且给出修复指引 ─────────────────
  #
  # 造现场（宿主机执行，用例本身不改文件系统）：
  #   mkdir -p tmp/auth-back
  #   cp -p .dsh/codebuddy-auth.json tmp/auth-back/
  #   chmod 000 .dsh/codebuddy-auth.json
  # 然后跑本套的破坏性用例（需临时把配置的 `tags.exclude` 换成 `tags.include`）。
  # **不需要重启 Desktop**。
  - name: TC-015b Desktop 端凭据不可读时报异常并给出修复指引
    tags: [FNOS-011, desktop, destructive]
    steps:

      # 记录用户原本所在的会话，收尾切回（本用例会点会话行离开插件面板，
      # 这会改变用户「当前所在会话」，按规范必须复原）。
      - dsh.desktopAssert:
          label: 记录原会话（收尾切回用）
          script: |
            (() => {
              const rows = [...document.querySelectorAll('[data-row-key^="session:"]')];
              if (rows.length === 0) return { pass: false, detail: '侧边栏没有会话行' };
              const current = rows.find(r => r.getAttribute('aria-selected') === 'true');
              globalThis.__dshOriginalSession = current === undefined
                ? null
                : current.getAttribute('data-row-key');
              return {
                pass: true,
                detail: globalThis.__dshOriginalSession === null ? '原会话：无' : '原会话已记录',
              };
            })()

      # **必须完全离开插件面板**（回会话页）：只切到插件列表页时宿主仍复用缓存。
      # 实测文件确已不存在时，切列表页再回来仍显示旧的「权限异常」；切回会话页再进来才正确。
      - dsh.desktopAssert:
          label: 离开插件面板以强制宿主重新读盘
          script: |
            (() => {
              // 注意：这里**不能**「本就不在详情页就直接成功」——那样会跳过离开动作，
              // 宿主不会被要求重新读盘，断言就落在旧状态上（实测由此失败过一次）。
              // 不在详情页时也要点一次会话行：它同样会让插件面板卸载。
              const row = document.querySelector('[data-row-key^="session:"]');
              if (row === null) return { pass: false, detail: '侧边栏没有会话行，无法离开面板' };
              const wasOnDetail = document.querySelector('.dsh-codebuddy-panel-page') !== null;
              row.click();
              return {
                pass: true,
                detail: wasOnDetail ? '已从详情页切回会话页' : '已点会话行以确保插件面板卸载',
              };
            })()

      - dsh.sleep:
          milliseconds: 800

      - dsh.desktopAssert:
          label: 回到插件列表页
          script: |
            (() => {
              if ((document.body?.innerText || '').includes('添加插件')) {
                return { pass: true, detail: '已在插件列表页' };
              }
              const nav = document.querySelector('nav');
              const entry = nav
                && [...nav.querySelectorAll('*')]
                  .find(n => n.children.length === 0 && (n.textContent || '').trim() === '插件');
              if (entry === undefined) return { pass: false, detail: '侧边栏无「插件」入口' };
              entry.click();
              return { pass: true, detail: '已点击「插件」' };
            })()

      - dsh.sleep:
          milliseconds: 800

      - dsh.desktopAssert:
          label: 重新打开 CodeBuddy 详情页
          script: |
            (() => {
              // 实测：包名在 `div.W9KtXa_titleRow` 里且**有子元素**，所以
              // 「叶子节点 + 文本完全相等」匹配不到；而该类名带构建哈希，不能作选择器。
              // 稳定契约：卡片主区域（cardMain）的文本以包名开头。
              // 可点的是卡片**内部**的 <button>（实测类名 W9KtXa_cardTitle）：沿
              // li→ul→section 查 React 事件处理器，整条祖先链一个都没有，所以
              // closest('[role=button], a, button, li') 会点了**没有 onClick** 的元素——
              // 步骤照样返回 pass，但面板并不会挂载（静默失败，实测踩过）。
              const btn = [...document.querySelectorAll('button')]
                .find(b => (b.textContent || '').trim().startsWith('@tnnevol/dsh-codebuddy'));
              if (btn === undefined) {
                return {
                  pass: false,
                  detail: '插件列表里没有该条目按钮；列表片段：'
                    + (document.body?.innerText || '').replace(/\s+/g, ' ').slice(0, 120),
                };
              }
              btn.click();
              return { pass: true, detail: '已点击插件条目按钮' };
            })()

      # 面板是异步渲染的：点开后先等它挂载完再断言，否则抢跑
      # （实测详情页约 1-2 秒后才有内容）。
      - dsh.sleep:
          milliseconds: 1500

      - dsh.desktopAssert:
          label: 凭据 0000 时显示警示块与 chmod 600 修复指引
          script: |
            (() => {
              const alert = document.querySelector('.dsh-codebuddy-credential-alert');
              if (alert === null) {
                return {
                  pass: false,
                  detail: '凭据为 0000 时未渲染权限异常警示——异常会被静默呈现为「未登录」'
                    + '（FNOS-011-04 要修的问题）。若权限确为 0000，先确认改的是 Desktop 那个'
                    + ' DSH_HOME 下的文件，并确认本用例已重新挂载面板',
                };
              }
              if (alert.getAttribute('role') !== 'alert') {
                return { pass: false, detail: '警示块缺少 role="alert"（无障碍契约）' };
              }
              const text = alert.textContent || '';
              if (!text.includes('凭据文件存在但不可读')) {
                return { pass: false, detail: '警示文案不符，实际：' + text.trim().slice(0, 90) };
              }
              if (!text.includes('chmod 600')) {
                return { pass: false, detail: '未给出 chmod 600 修复指引，实际：' + text.trim().slice(0, 90) };
              }
              return { pass: true, detail: '警示块与修复指引齐备' };
            })()

      - dsh.desktopAssert:
          label: 警示块在场且账号数为 0（并存是设计如此，非缺陷）
          script: |
            (() => {
              // 源码 `panel.tsx:295-300` 在 credentialUnusable 时**同时**渲染警示块，
              // 而账号列表为空自然落到「暂无已登录账号」空状态——两者并存是设计如此。
              // 因此不断言「不应出现未登录文案」（那是错的），只断言**警示块在场**
              // 且账号数为 0：这正是「异常没有被静默」的 FNOS-011-04 验收点。
              const panel = document.querySelector('.dsh-codebuddy-panel-page');
              if (panel === null) return { pass: false, detail: 'CodeBuddy 面板未挂载' };
              if (document.querySelector('.dsh-codebuddy-credential-alert') === null) {
                return { pass: false, detail: '警示块消失，异常又被静默了' };
              }
              const text = (panel.textContent || '').replace(/\s+/g, ' ');
              const count = /账号管理\s*(\d+)/.exec(text);
              if (count === null) return { pass: false, detail: '未找到账号计数，实际：' + text.slice(0, 60) };
              if (count[1] !== '0') {
                return { pass: false, detail: '凭据不可读却列出 ' + count[1] + ' 个账号' };
              }
              return { pass: true, detail: '警示块在场、账号数 0（并存是设计如此）' };
            })()

      - dsh.desktopAssert:
          label: 收尾切回原会话并清除探针（不留痕）
          script: |
            (async () => {
              const original = globalThis.__dshOriginalSession;
              delete globalThis.__dshOriginalSession;
              if (original === null || original === undefined) {
                return { pass: true, detail: '测试前本不在历史上，无需切回；探针已清除' };
              }
              const row = document.querySelector('[data-row-key="' + original + '"]');
              if (row === null) {
                return { pass: true, detail: '原会话行已不存在；探针已清除' };
              }
              row.click();
              await new Promise(r => setTimeout(r, 300));
              const current = [...document.querySelectorAll('[data-row-key^="session:"]')]
                .find(r => r.getAttribute('aria-selected') === 'true');
              return { pass: current?.getAttribute('data-row-key') === original,
                detail: current?.getAttribute('data-row-key') === original
                  ? '已切回原会话'
                  : '切回未生效，当前 ' + (current?.getAttribute('data-row-key') ?? '未知') };
            })()