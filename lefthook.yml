commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    staged-lint:
      run: pnpm exec lint-staged
    # pnpm install 会把 catalog:dsh 解析成字面版本写回插件清单，且不报错；
    # 只要 git add -A 就会把污染提交进去。这里拦在源头（毫秒级，只读七个 JSON）。
    catalog-drift:
      glob: 'plugins/*/package.json'
      run: pnpm exec fnos-dsh-cli check-catalog

pre-push:
  commands:
    repository-check:
      run: pnpm run check -- --all
