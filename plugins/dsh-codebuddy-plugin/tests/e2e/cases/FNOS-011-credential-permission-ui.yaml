# FNOS-011 凭据权限的界面呈现（CodeBuddy 插件）
#
# 用例编号与 docs/tests/FNOS-011-credential-permission-diagnostics.md 对齐：
# 测试文档是**权威台账**，本文件是**执行载体**。
#
# 覆盖 FNOS-011-04「插件区分两态」的**界面环节**。判定逻辑与载荷形状已由单测覆盖
# （`dsh-plugin-kit` 的五态判定、本插件 `storage-file-state.spec.ts` 的 `credentialState`
# 载荷），这里补的是单测到不了的那一步：**界面真的把警示块渲染出来、文案对用户可读、
# 且与「未登录」可区分**。
#
# ## 断言契约（取自组件源码，不靠猜）
#
# `src/client/panel.tsx`：`credentialState === 'unusable'` 时渲染
# `<div className="dsh-codebuddy-credential-alert" role="alert">`，内含两条文案
# （`src/client/locales/zh.ts`）：
# - `credentialUnusable`：凭据文件存在但不可读（权限位异常），账号列表无法显示。
# - `credentialUnusableHint`：在宿主机执行 chmod 600 修复凭据文件权限后重启 DSH；不需要重新登录。
#
# 用例按这些**稳定契约**断言（类名与 role），不依赖颜色等易变表现。
#
# ## 断言方式
#
# 一律用 `dsh.assertInPage`（页面内精确判定 + 失败真正传播）。**不要**用 `javascript`
# 步骤做断言——它的 `throw` 被 CDP `Runtime.evaluate` 静默吞掉，会造成假阳性
# （详见 `@tnnevol/dsh-e2e-kit` 的 assert-node 模块注释）。

cases:
  # ── 只读：正常登录态下不应出现警示块 ──────────────────────────────
  - name: TC-013a 凭据正常时不显示权限异常警示
    tags: [FNOS-011, ui, readonly]
    steps:
      # 进入 CodeBuddy 插件的详情页（面板挂载在插件面板里）。
      - aiAct: >-
          在 DSH Web 界面左侧点击「插件」进入插件列表，找到并点开
          「@tnnevol/dsh-codebuddy」插件，进入它的详情页。
      - dsh.assertInPage:
          label: 凭据正常时无权限异常警示块
          script: |
            (() => {
              const alert = document.querySelector('.dsh-codebuddy-credential-alert');
              if (alert !== null) {
                return {
                  pass: false,
                  detail: '凭据正常却出现了权限异常警示块：'
                    + (alert.textContent || '').trim().slice(0, 80),
                };
              }
              // 面板本身应已挂载（否则「没有警示块」是因为页面根本没打开，属误判）。
              const panel = document.querySelector('.dsh-codebuddy-panel-page');
              if (panel === null) {
                return { pass: false, detail: 'CodeBuddy 面板未挂载，无法判断警示块是否存在' };
              }
              return { pass: true, detail: '面板已挂载且无权限异常警示块' };
            })()
      - aiAssert: 页面显示的是 CodeBuddy 插件的账号管理面板

  # ── 破坏性：凭据不可读（0000）应给出异常与修复指引 ────────────────
  #
  # 前置（由执行者按测试规范操作，用例本身不改文件系统——浏览器到不了宿主机）：
  #   1. 备份：cp -p "$DSH_HOME/codebuddy-auth.json" "tmp/auth-back/dsh-codebuddy-<版本>-<日期>/"
  #   2. 造现场：chmod 000 "$DSH_HOME/codebuddy-auth.json"
  #   3. 重启 DSH Web 使宿主重新读取
  #   4. 跑本用例：临时把 `midscene.config.ts` 里的 `tags: { exclude: ['destructive'] }`
  #      注释掉，然后 `pnpm exec midscene-test --config tests/e2e/midscene.config.ts`
  #      （CLI **没有** `--tags` 参数，实测确认；标签过滤只在配置里生效）
  #   5. **恢复（必做）**：cp -p 回原位后**显式** chmod 600（`cp -p` 会带上异常权限位）
  #
  # 用例只做**界面取证**：确认警示块出现、文案含修复指引。
  - name: TC-013b 凭据权限异常时显示警示与修复指引
    tags: [FNOS-011, ui, destructive]
    steps:
      - aiAct: >-
          在 DSH Web 界面左侧点击「插件」进入插件列表，找到并点开
          「@tnnevol/dsh-codebuddy」插件，进入它的详情页；若面板已打开则先刷新页面。
      - dsh.assertInPage:
          label: 权限异常时显示警示块且文案含修复指引
          script: |
            (() => {
              const alert = document.querySelector('.dsh-codebuddy-credential-alert');
              if (alert === null) {
                return {
                  pass: false,
                  detail: '凭据为 0000 时未渲染权限异常警示块——这会使异常静默呈现为「未登录」（FNOS-011-04 要修的问题）',
                };
              }
              if (alert.getAttribute('role') !== 'alert') {
                return { pass: false, detail: '警示块缺少 role="alert"（无障碍契约）' };
              }
              const text = alert.textContent || '';
              if (!text.includes('凭据文件存在但不可读')) {
                return { pass: false, detail: '警示文案不符，实际：' + text.trim().slice(0, 90) };
              }
              if (!text.includes('chmod 600')) {
                return { pass: false, detail: '未给出 chmod 600 修复指引，实际：' + text.trim().slice(0, 90) };
              }
              return { pass: true, detail: '警示块与修复指引齐备' };
            })()
      - aiAssert: 账号区上方有一个明显的警示块，说明凭据文件不可读并给出修复方法

  # ── 破坏性：凭据不存在应呈现「未登录」而非异常 ────────────────────
  #
  # 前置：备份后**移走**（而非 chmod）`$DSH_HOME/codebuddy-auth.json`，重启 DSH Web。
  # 恢复同 TC-013b。
  - name: TC-014a 凭据不存在时呈现未登录且不报异常
    tags: [FNOS-011, ui, destructive]
    steps:
      - aiAct: >-
          在 DSH Web 界面左侧点击「插件」进入插件列表，找到并点开
          「@tnnevol/dsh-codebuddy」插件，进入它的详情页；若面板已打开则先刷新页面。
      - dsh.assertInPage:
          label: 凭据不存在时无警示块（与「不可读」可区分）
          script: |
            (() => {
              const panel = document.querySelector('.dsh-codebuddy-panel-page');
              if (panel === null) return { pass: false, detail: 'CodeBuddy 面板未挂载' };
              const alert = document.querySelector('.dsh-codebuddy-credential-alert');
              if (alert !== null) {
                return {
                  pass: false,
                  detail: '凭据仅是「不存在」却报了权限异常，两态未区分：'
                    + (alert.textContent || '').trim().slice(0, 80),
                };
              }
              const text = panel.textContent || '';
              if (!text.includes('暂无已登录账号')) {
                return { pass: false, detail: '未呈现「未登录」空状态，实际：' + text.trim().slice(0, 90) };
              }
              return { pass: true, detail: '呈现未登录空状态且无异常警示' };
            })()
      - aiAssert: 账号管理区显示暂无已登录账号，且没有权限异常警示块
