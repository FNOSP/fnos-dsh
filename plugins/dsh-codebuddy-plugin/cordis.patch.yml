# The @tnnevol/dsh-codebuddy bundle patch.
#
# Applied as ONE insert after the in-box bundle layers, so this row lands on
# top of them without touching any row they own. Registering a provider needs
# no change to the `llm` row — this plugin injects the `llm` service and calls
# `ctx.llm.registerAdapter()` when it activates.
#
# `connection.rpc.handle()` resolves the route owner from the Context it is read
# through, so that service must already carry the Web-server dependency. dsh
# 0.2.1-rc.2 renamed the browser-trust provider: the `web-runtime` row no longer
# provides `webRuntime`, and a row still injecting it waits forever on a service
# that never mounts (the plugin row shows as loading instead of reporting an
# error). Inject the current provider instead.
- id: connection
  inject:
    - webStartup
    - webServer

# Config is omitted deliberately — every field of the plugin's Config is
# optional and the shipped defaults reach the public CodeBuddy service. There
# is no credential field by design; sign in through the Web Settings →
# CodeBuddy page.

- insert:
    - id: dsh-codebuddy
      name: '@tnnevol/dsh-codebuddy'
