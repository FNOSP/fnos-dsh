# FNOS-013 Midscene 插件的界面验收
#
# 用例编号与 docs/tests/FNOS-013-midscene-browser-automation-bridge.md 对齐：
# 测试文档是**权威台账**，本文件是**执行载体**。
#
# 覆盖插件在 DSH Web 上的**界面环节**：
# - 设置区块的渲染与字段（TC-034 的界面部分、以及「设置界面实测」那条结论的执行载体）；
# - 插件图标在管理页的显示（TC-051、TC-052）。
#
# ## 断言契约（取自组件源码，不靠猜）
#
# - 设置区块根类名：`.dsh-midscene-settings`（`src/client/settings-section.tsx`）
# - 字段文案（`src/client/locales.ts`）：「接入密钥」「各职责使用的模型」「接入配置」
#   - `apiKeyHint`：桥接服务的接入密钥，不是模型密钥。
#   - `modelsHint`：只列出具备识图能力的模型…（FNOS-021 起该字段是**四个职责 Tab**）
#
# ## 断言方式
#
# 一律用 `dsh.assertInPage`（失败会真正让用例失败）。**不要**用 `javascript` 步骤做断言
# ——它的 `throw` 被 CDP `Runtime.evaluate` 静默吞掉，会造成假阳性（详见 assert-node 注释）。
#
# ## 导航必须拆成「小步、确定」（实测第三个坑）
#
# 把「点击插件 → 找到并点开某插件 → 若关闭则打开」写成一个长 `aiAct`，实测会让模型
# 自己决定滚动去找目标，而**滚动在 DPR=2 下会触发上游解析器报错**：
#
# ```
# XML parse error: Invalid parameters for action Scroll:
#   coordinates [300,0,2000,1002] exceed normalized range [0, 1000]
# ```
#
# 模型把 bbox 算成了屏幕像素（宽 2000 > 视口 1920），超出上游 1000 的归一化上限。
# 因此导航要**拆成单个明确动作**，并在需要滚动时用页面内脚本（`element.scrollIntoView`）
# 而不是让视觉模型去滚。
#
# ## 图标用例的注意点
#
# TC-051 要求「显示随包分发的本地图片（**无外部请求**）」。因此断言里除检查 `<img>` 存在，
# 还要确认它的 `src` 是包内相对路径或 data URI，**不是** `http(s)://` 外链。

cases:
  # ── 设置区块渲染与字段齐备 ────────────────────────────────────────
  - name: TC-034a 插件详情页的设置区块渲染出三个字段
    tags: [FNOS-013, ui, settings]
    steps:
      # 导航拆成小步（不要写成一个长 aiAct——那会让模型自己滚动，触发上游 bbox 越界）。
      - aiAct: 点击 DSH Web 界面左侧的「插件」菜单项
      - aiAct: 在插件列表里向下滚动到能找到 @tnnevol/dsh-midscene 这一项的位置
      - aiAct: 点击 @tnnevol/dsh-midscene 插件条目，打开它的详情页
      - dsh.assertInPage:
          label: 设置区块挂载且三个字段文案齐备
          script: |
            (() => {
              const root = document.querySelector('.dsh-midscene-settings');
              if (root === null) {
                return { pass: false, detail: '未找到 .dsh-midscene-settings（设置区块未挂载）' };
              }
              const text = root.textContent || '';
              // FNOS-021-02：模型选择必须是四个职责 Tab，不再是单个下拉。
              const tabs = Array.from(root.querySelectorAll('[role="tab"], .semi-tabs-tab'))
                .map(t => (t.textContent || '').trim());
              const wantTabs = ['默认', '定位', '规划', '页面理解'];
              const missingTabs = wantTabs.filter(n => !tabs.includes(n));
              if (missingTabs.length > 0) {
                return { pass: false, detail: '缺少职责 Tab：' + missingTabs.join('、') + '；实际：' + tabs.join('/') };
              }
              // 每个职责一个下拉（四个 Tab 各一个）。
              if (root.querySelectorAll('.semi-select').length < 4) {
                return { pass: false, detail: '下拉数量不足 4 个：' + root.querySelectorAll('.semi-select').length };
              }
              const want = ['接入密钥', '各职责使用的模型', '接入配置'];
              const missing = want.filter(n => !text.includes(n));
              if (missing.length > 0) {
                return { pass: false, detail: '缺少字段文案：' + missing.join('、') };
              }
              // 密钥提示必须说明「不是模型密钥」——这是防误用文案。
              if (!text.includes('不是模型密钥')) {
                return { pass: false, detail: '接入密钥的提示未说明「不是模型密钥」' };
              }
              // 接入配置必须同时讲清**两个去处**：命令行 .env 与 Midscene 浏览器扩展。
              // 只写 .env 时扩展侧边栏用不上 DSH 的模型，用户会被引向申请第三方 key——
              // 那正是本插件要消除的成本。
              if (!text.includes('浏览器扩展')) {
                return { pass: false, detail: '接入配置的说明未提到 Midscene 浏览器扩展' };
              }
              if (!text.includes('.env')) {
                return { pass: false, detail: '接入配置的说明未提到命令行 .env' };
              }
              if (!text.includes('不需要任何第三方模型密钥')) {
                return { pass: false, detail: '未说明不需要第三方模型密钥（会被误读成要先配模型）' };
              }
              return {
                pass: true,
                detail: '三个字段齐备；接入配置同时覆盖 .env 与浏览器扩展，并声明不需要第三方密钥',
              };
            })()
      # 「接入配置预览」在首屏之下：视觉断言只看首屏能看到的字段，
      # 预览的存在性由上面的页内断言（DOM）覆盖——两者互补，不重复判定可见性。
      - aiAssert: 插件详情页里可以看到 Midscene 的设置区，包含接入密钥与四个职责（默认、定位、规划、页面理解）的模型选择

  # ── 接入密钥可显示与重新生成 ──────────────────────────────────────
  # 注意：本用例会点「随机重新生成」——**桥的接入密钥随之变化**，而 Midscene 的接入配置
  # 在 Agent 创建时就固定了，同轮后续用例会全部 401。因此标记 `destructive` 默认排除，
  # 需要单独跑：`midscene-test --config tests/e2e/midscene.config.ts --tag destructive`。
  # 密钥的两种形态也可分开验：显示（无副作用）随常规轮次跑；重新生成用接口核对。
  - name: TC-034b 接入密钥可显示且重新生成后变化
    tags: [FNOS-013, ui, settings, destructive]
    steps:
      - aiAct: >-
          在 Midscene 插件的设置区里，点击「接入密钥」一栏的显示按钮（眼睛图标），
          让密钥明文显示出来。
      - dsh.assertInPage:
          label: 密钥显示为十六进制串（说明密文可见且形态正确）
          script: |
            (() => {
              const root = document.querySelector('.dsh-midscene-settings');
              if (root === null) return { pass: false, detail: '设置区块未挂载' };
              // 密钥是 32 位十六进制（桥接接入密钥，非模型密钥）。
              const text = root.innerText || '';
              const hex = text.match(/[0-9a-f]{32}/);
              if (hex === null) {
                return { pass: false, detail: '未看到 32 位十六进制密钥；当前可见文本：' + text.slice(0, 120) };
              }
              // 同时把值记进断言详情，便于人工核对「确实显示了」而不是静态占位。
              return { pass: true, detail: '密钥可见（' + hex[0].slice(0, 8) + '…，长度 32）' };
            })()

  # ── 各职责模型：四个 Tab、下拉且可清空 ────────────────────────────
  - name: TC-034c 各职责模型以四个 Tab 呈现、可下拉选择且可清空
    tags: [FNOS-013, ui, settings]
    steps:
      - aiAct: 在 Midscene 插件的设置区里，点击「各职责使用的模型」下面「默认」Tab 的下拉选择框，展开选项列表
      - dsh.assertInPage:
          label: 下拉展开后有可选项，且存在清空入口
          script: |
            (() => {
              // Semi 的下拉浮层挂在 body 下（不在设置区块内）。
              const options = document.querySelectorAll('.semi-select-option');
              if (options.length === 0) {
                return { pass: false, detail: '下拉展开后没有选项（未展开或模型目录为空）' };
              }
              // 「可清空」由 Select 的 showClear 提供：鼠标悬停/展开时才渲染清除图标。
              const clear = document.querySelector('.semi-select-clear');
              const root = document.querySelector('.dsh-midscene-settings');
              const hint = root === null ? '' : (root.innerText || '');
              return {
                pass: true,
                detail: '选项 ' + options.length + ' 个；清除图标'
                  + (clear === null ? '当前未渲染（Semi 仅在悬停/展开时显示，属预期）' : '已渲染')
                  + '；为空提示：' + (hint.includes('未指定') ? '有' : '无'),
              };
            })()
      # 收尾：收起下拉，避免浮层影响后续用例。
      - aiAct: 按 Esc 键关闭刚才展开的下拉列表

  # ── 插件图标：随包分发且无外部请求 ────────────────────────────────
  #
  # **注意滚动**（实测踩到）：Midscene 条目在「已安装」列表底部，默认可能只露出顶部
  # 一小截，视觉断言因而判「无法确认」（模型如实报告「条目被截断」）。所以先用代码把它
  # 滚进视口，再做视觉断言——否则会得到一个指向不了真因的失败。
  - name: TC-051 插件管理页显示随包分发的本地图标
    tags: [FNOS-013, ui, icon]
    steps:
      # 回到插件列表（图标在列表项上）。分两步，避免模型自行滚动。
      - aiAct: 点击插件详情页左上角的返回箭头
      - aiAct: 确认当前停在插件列表页（可见「已安装」分组）
      # 把 Midscene 条目滚进视口并高亮，便于视觉断言看清图标。
      - dsh.assertInPage:
          label: 把 Midscene 插件条目滚动到可见区域
          script: |
            (() => {
              // 插件列表项里含有该插件名的那一项。
              // 列表卡片显示的是**插件显示名**（「Midscene 桥接」），不是包名
              // `dsh-midscene`——后者只出现在启动载荷里，可见文本中没有。
              const title = [...document.querySelectorAll('button, [class*="cardTitle"]')]
                .find(e => (e.textContent || '').trim() === 'Midscene 桥接');
              // 只认 `li`：`closest('li, [class*="card"]')` 会先命中标题按钮自身
              // （它的类名含 `cardTitle`），拿到的是按钮而不是整张卡片。
              const target = title ? title.closest('li') : null;
              if (!target) {
                return { pass: false, detail: '列表里找不到「Midscene 桥接」条目（可能未安装或列表未加载）' };
              }
              target.scrollIntoView({ block: 'center' });
              const r = target.getBoundingClientRect();
              if (r.height < 8 || r.top < 0 || r.bottom > window.innerHeight) {
                return { pass: false, detail: '滚动后条目仍未完整可见：top=' + Math.round(r.top)
                  + ' bottom=' + Math.round(r.bottom) + ' 视口高=' + window.innerHeight };
              }
              return { pass: true, detail: '条目已完整可见（top=' + Math.round(r.top) + '）' };
            })()
      - dsh.assertInPage:
          label: 插件列表项显示本地图标且无外部请求
          script: |
            (() => {
              // 只看本插件这张卡片，别的插件的图标与本契约无关。
              const title = [...document.querySelectorAll('button, [class*="cardTitle"]')]
                .find(e => (e.textContent || '').trim() === 'Midscene 桥接');
              const card = title ? title.closest('li') : null;
              if (card === null) {
                return { pass: false, detail: '列表里找不到「Midscene 桥接」条目' };
              }
              // 图标挂在与标题同一行里、`aria-hidden` 的装饰容器上。
              const head = card.querySelector('[class*="cardHead"]') || card;
              const iconBox = head.querySelector('[class*="cardIcon"]')
                || head.querySelector('img, svg')?.parentElement
                || null;
              if (iconBox === null) {
                return { pass: false, detail: '卡片里没有图标容器（可能是纯文字条目）' };
              }
              const img = iconBox.querySelector('img');
              const svgCount = iconBox.querySelectorAll('svg').length;
              const r = iconBox.getBoundingClientRect();
              const src = img ? (img.getAttribute('src') || '') : '';
              const isLocal = src.startsWith('data:') || (src.length > 0 && !/^https?:\/\//.test(src) && !src.startsWith('//'));
              if (img === null && svgCount === 0) {
                return { pass: false, detail: '图标容器里既没有 img 也没有 svg' };
              }
              if (img !== null && !isLocal) {
                return { pass: false, detail: '图标来自外链，违反随包分发契约：' + src.slice(0, 60) };
              }
              if (r.width < 8 || r.height < 8) {
                return { pass: false, detail: '图标尺寸过小：' + Math.round(r.width) + 'x' + Math.round(r.height) };
              }
              return {
                pass: true,
                detail: '图标渲染正常：' + Math.round(r.width) + 'x' + Math.round(r.height)
                  + '，来源=' + (src.startsWith('data:') ? 'data URI（随包分发，无外部请求）' : src.slice(0, 40)),
              };
            })()
      - aiAssert: 插件列表里 Midscene 插件条目带有一个彩色图标（不是空白占位）

  # ── 图标在暗色主题下仍可见 ────────────────────────────────────────
  - name: TC-052 图标在暗色主题下清晰可见
    tags: [FNOS-013, ui, icon, theme]
    steps:
      # 切到暗色主题：用 DSH 真实的主题机制（设置页里的外观切换），而不是自己改
      # `data-theme` 属性——那样只是给用例看，产品并不会真的换主题（假验证）。
      - aiAct: >-
          打开 DSH 的设置页面，找到「外观」或「主题」设置项，把主题切换到暗色（深色）模式，
          然后回到插件列表页面
      # 同样先确保条目完整可见，再做视觉断言。
      - dsh.assertInPage:
          label: 暗色下把 Midscene 条目滚动到可见区域
          script: |
            (() => {
              // 列表卡片显示的是**插件显示名**（「Midscene 桥接」），不是包名
              // `dsh-midscene`——后者只出现在启动载荷里，可见文本中没有。
              const title = [...document.querySelectorAll('button, [class*="cardTitle"]')]
                .find(e => (e.textContent || '').trim() === 'Midscene 桥接');
              // 只认 `li`：`closest('li, [class*="card"]')` 会先命中标题按钮自身
              // （它的类名含 `cardTitle`），拿到的是按钮而不是整张卡片。
              const target = title ? title.closest('li') : null;
              if (!target) return { pass: false, detail: '列表里找不到「Midscene 桥接」条目' };
              target.scrollIntoView({ block: 'center' });
              const r = target.getBoundingClientRect();
              if (r.height < 8 || r.top < 0 || r.bottom > window.innerHeight) {
                return { pass: false, detail: '条目未完整可见（top=' + Math.round(r.top) + '）' };
              }
              return { pass: true, detail: '条目已完整可见' };
            })()
      - aiAssert: 在暗色背景下，Midscene 插件的图标依然清晰可辨，没有被背景吞掉
      # 收尾：切回亮色，避免影响后续用例（同样走真实设置）。
      - aiAct: 回到设置页面，把主题切换回亮色（浅色）模式

  # ── 桥接模式的核心承诺：按自然语言意图驱动第三方站点 ──────────────────
  #
  # 前面几条验的是插件**自己的界面**；这条验的是插件的**存在意义**——用户不必写选择器，
  # 用一句话表达意图就能在一个陌生站点里走完多级目录并打开目标文件。
  #
  # 它必然依赖外部环境（站点、目录名、文件名），因此默认按 `capability` 标签排除，
  # 只在显式提供 `DSH_BRIDGE_SITE` / `DSH_BRIDGE_PATH` / `DSH_BRIDGE_FILE` 时运行。
  - name: TC-060 桥接模式按自然语言意图驱动第三方站点
    tags: [FNOS-013, ui, bridge, capability]
    steps:
      # 一次 aiAct 表达完整意图：多级目录由模型自己逐级点开。拆成每级一步会慢得多
      # （每步一次模型调用），而自然语言本来就擅长表达「依次进入」这类过程。
      - aiAct:
          prompt: >-
            打开 ${demoSite}。这是一个文件列表站点，列表行很密集、相邻行容易点错。
            请按顺序逐级进入下面这些目录，直到进入最后一级：
            ${demoPath}（用「/」分隔层级）。
            要求：每一级都点该文件夹的**名称文字**（不要点行尾或相邻行），
            并在每次点击后**核对页面顶部的面包屑**是否已进入该目录；
            如果面包屑没变或进错了目录，先回到上一级再重点。
          options:
            deepThink: true
      # 在目标目录里按文件名打开图片。文件列表可能很长，模型需要滚动查找。
      - aiAct:
          prompt: >-
            在当前文件列表里找到并打开这个文件：${demoFile}。
            如果列表里看不到它，先向下滚动再找。
          options:
            deepThink: true
      # 断言「图片真的显示出来了」：用图片自身的 naturalWidth/Height 判定，而不是靠观感。
      # 这条断言同时说明它看到了哪张图（src），便于核对打开的是否为目标文件。
      - dsh.assertInPage:
          label: 目标图片已打开并可见
          script: |
            (() => {
              const imgs = [...document.querySelectorAll('img')].filter(
                el => el.naturalWidth >= 200 && el.naturalHeight >= 200,
              );
              if (imgs.length === 0) {
                return { pass: false, detail: '页面上没有可见的大图，图片可能没有打开' };
              }
              const decoded = el => decodeURIComponent(el.currentSrc || el.src || '');
              // **必须核对到具体文件**：只断言「有大图」会把「打开了别的图片」也算通过。
              // 预览 URL 是路径式的（`/p/<完整路径>`），因此文件名会出现在 src 里。
              const target = '${demoFile}';
              const hit = imgs.find(el => decoded(el).includes(target));
              if (!hit) {
                const shown = imgs.map(decoded).join(' | ').slice(0, 200);
                return { pass: false, detail: '已显示的图片里没有目标文件「' + target + '」；实际：' + shown };
              }
              return { pass: true, detail: '目标图片已打开：' + decoded(hit).slice(-140) };
            })()
